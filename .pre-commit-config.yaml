fail_fast: true

# `Course Materials/pulp_tutorial.py` is a reference file exported from Google
# Colab (contains `!pip install ...` magics) — not valid standalone Python, and
# not part of the jupytext-paired lecture scripts, so skip the Python-specific
# hooks for it.
exclude: ^Course Materials/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--float-to-top"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy

  - repo: local
    hooks:
      - id: jupytext-sync
        name: jupytext-sync
        entry: uv run jupytext --sync
        language: system
        files: ^(scripts/.*\.py|notebooks/.*\.ipynb)$
