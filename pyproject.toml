[project]
name = "jupyterbook-sso"
version = "0.1.0"
description = "Lecture notes for the simulation and optimization part of SSO, as a Jupyter Book"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyter-book>=2,<3",
    "jupytext>=1.16",
    "ipykernel>=6.29",
    "pulp[highs]==3.3.2",
    "scipy>=1.13",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "plotly>=5.24",
    "nbformat>=5.10",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.3",
    "pre-commit>=3.7",
    "isort>=5.13",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.jupytext.formats]
"notebooks/" = "ipynb"
"scripts/" = "py:percent"

[tool.isort]
profile = "black"
line_length = 79

[tool.ruff]
line-length = 79

[tool.ruff.lint.per-file-ignores]
# notebooks import a module in the first visible cell that uses it,
# also when a hidden cell imported it before
"scripts/*.py" = ["E402", "F811"]
"notebooks/*.ipynb" = ["E402", "F811"]

[tool.mypy]
ignore_missing_imports = true
